version: "3"

x-config-host: &config-host ${HOST:-0.0.0.0}
x-config-port: &config-port ${PORT:-12035}

services:
  nonebot:
    build: .
    image: tano26/nsybot:latest
    # 只声明容器端口，不发布到宿主机；跨项目通信使用共享 Docker 网络。
    expose:
      - *config-port
    env_file:
      - .env.prod
    environment:
      ENVIRONMENT: prod
      HOST: *config-host
      PORT: *config-port
      REFRESH_TIME: "20"
      WEB_CONCURRENCY: "1"
      MAX_WORKERS: "1"
    # 整个运行容器的十进制 300 MB 上限；禁止以 swap 隐藏超额内存。
    mem_limit: 300000000
    memswap_limit: 300000000
    restart: always

    volumes:
      - ./data:/app/data
