<svg xmlns="http://www.w3.org/2000/svg" width="296.333333mm" height="296.333333mm" viewBox="0 0 1120 1120" role="img" aria-labelledby="title description"><title id="title">QQ 按群投递：窗口、去重与降级</title><desc id="description">每 60 秒检查缓存；成功记录与静默 / 过滤记录分别保存在 Detail。</desc><defs><marker id="arrow-blue" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#3168DC"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#16877B"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#BD6A18"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#BE5151"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#765CC1"/></marker></defs><g font-family="Songti SC, SimSun, Noto Serif CJK SC, serif"><rect width="1120" height="1120" fill="#FFFFFF"/><path d="M328 302 L420 302" fill="none" stroke="#3168DC" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/><path d="M700 302 L792 302" fill="none" stroke="#3168DC" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/><path d="M560 380 L560 425 L188 425 L188 476" fill="none" stroke="#BD6A18" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-amber)"/><path d="M792 302 L744 302 L744 422 L560 422 L560 476" fill="none" stroke="#765CC1" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-purple)"/><path d="M932 380 L932 476" fill="none" stroke="#3168DC" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/><path d="M932 632 L932 748" fill="none" stroke="#16877B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/><path d="M792 554 L744 554 L744 696 L560 696 L560 748" fill="none" stroke="#BE5151" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-red)"/><text x="48" y="33" font-size="13" font-weight="400" fill="#607188" text-anchor="start" letter-spacing="1.6">NSYBOT  /  CURRENT IMPLEMENTATION</text><text x="48" y="83" font-size="36" font-weight="700" fill="#1B2D49" text-anchor="start" letter-spacing="0">QQ 按群投递：窗口、去重与降级</text><text x="48" y="119" font-size="17" font-weight="400" fill="#607188" text-anchor="start" letter-spacing="0">每 60 秒检查缓存；成功记录与静默 / 过滤记录分别保存在 Detail。</text><path d="M48 145H1072" stroke="#DCE4EF" stroke-width="1"/><text x="1072" y="77" font-size="17" font-weight="400" fill="#3168DC" text-anchor="end" letter-spacing="0">04 / 06</text><g id="delivery-gate"><rect x="48" y="224" width="280" height="156" rx="15" fill="#FFFFFF" stroke="#DCE4EF" stroke-width="1.3"/><path d="M63 224H313Q328 224 328 239V263H48V239Q48 224 63 224Z" fill="#EDF3FF"/></g><text x="68" y="249" font-size="13" font-weight="700" fill="#3168DC" text-anchor="start" letter-spacing="0.6">ENTRY / CACHE CHECK</text><text x="68" y="289" font-size="21" font-weight="700" fill="#1B2D49" text-anchor="start" letter-spacing="0">读取可投递的新快照</text><text x="68" y="317" font-size="17" font-weight="400" fill="#607188" text-anchor="start" letter-spacing="0">QQ 在线；自动推送避开 02–08</text><text x="68" y="342" font-size="17" font-weight="400" fill="#607188" text-anchor="start" letter-spacing="0">账号已在本次启动后刷新</text><text x="68" y="367" font-size="17" font-weight="400" fill="#607188" text-anchor="start" letter-spacing="0">摘要 / 订阅 / 配置变化才处理</text><g id="window-policy"><rect x="420" y="224" width="280" height="156" rx="15" fill="#FFFFFF" stroke="#DCE4EF" stroke-width="1.3"/><path d="M435 224H685Q700 224 700 239V263H420V239Q420 224 435 224Z" fill="#EDF3FF"/></g><text x="440" y="249" font-size="13" font-weight="700" fill="#3168DC" text-anchor="start" letter-spacing="0.6">STARTUP / WINDOW</text><text x="440" y="289" font-size="21" font-weight="700" fill="#1B2D49" text-anchor="start" letter-spacing="0">基线与篇数选择</text><text x="440" y="317" font-size="17" font-weight="400" fill="#607188" text-anchor="start" letter-spacing="0">启动长离线时：全窗口静默</text><text x="440" y="342" font-size="17" font-weight="400" fill="#607188" text-anchor="start" letter-spacing="0">默认最近 1 篇，0 表示全部</text><text x="440" y="367" font-size="17" font-weight="400" fill="#607188" text-anchor="start" letter-spacing="0">窗口外文章持久化标记跳过</text><g id="per-article"><rect x="792" y="224" width="280" height="156" rx="15" fill="#FFFFFF" stroke="#DCE4EF" stroke-width="1.3"/><path d="M807 224H1057Q1072 224 1072 239V263H792V239Q792 224 807 224Z" fill="#EDF3FF"/></g><text x="812" y="249" font-size="13" font-weight="700" fill="#3168DC" text-anchor="start" letter-spacing="0.6">DECISION / PER GROUP</text><text x="812" y="289" font-size="21" font-weight="700" fill="#1B2D49" text-anchor="start" letter-spacing="0">逐篇去重与群过滤</text><text x="812" y="317" font-size="17" font-weight="400" fill="#607188" text-anchor="start" letter-spacing="0">先查成功与跳过记录</text><text x="812" y="342" font-size="17" font-weight="400" fill="#607188" text-anchor="start" letter-spacing="0">再按自转发 / 转发设置决策</text><text x="812" y="367" font-size="17" font-weight="400" fill="#607188" text-anchor="start" letter-spacing="0">允许发送才加载正文与翻译</text><g id="quiet"><rect x="48" y="476" width="280" height="132" rx="15" fill="#FFFFFF" stroke="#DCE4EF" stroke-width="1.3"/><path d="M63 476H313Q328 476 328 491V515H48V491Q48 476 63 476Z" fill="#FFF5E9"/></g><text x="68" y="501" font-size="13" font-weight="700" fill="#BD6A18" text-anchor="start" letter-spacing="0.6">STARTUP / WINDOW</text><text x="68" y="541" font-size="21" font-weight="700" fill="#1B2D49" text-anchor="start" letter-spacing="0">写入静默或窗口外标记</text><text x="68" y="569" font-size="17" font-weight="400" fill="#607188" text-anchor="start" letter-spacing="0">rss-skip 记录，updated 为空</text><text x="68" y="594" font-size="17" font-weight="400" fill="#607188" text-anchor="start" letter-spacing="0">不删除 Content 历史</text><g id="already-or-filtered"><rect x="420" y="476" width="280" height="156" rx="15" fill="#FFFFFF" stroke="#DCE4EF" stroke-width="1.3"/><path d="M435 476H685Q700 476 700 491V515H420V491Q420 476 435 476Z" fill="#F2EEFA"/></g><text x="440" y="501" font-size="13" font-weight="700" fill="#765CC1" text-anchor="start" letter-spacing="0.6">ALREADY_DELIVERED / FILTERED</text><text x="440" y="541" font-size="21" font-weight="700" fill="#1B2D49" text-anchor="start" letter-spacing="0">已处理或被过滤</text><text x="440" y="569" font-size="17" font-weight="400" fill="#607188" text-anchor="start" letter-spacing="0">已有成功 / skip 记录：不再发送</text><text x="440" y="594" font-size="17" font-weight="400" fill="#607188" text-anchor="start" letter-spacing="0">被群设置过滤：写 rss-skip</text><text x="440" y="619" font-size="17" font-weight="400" fill="#607188" text-anchor="start" letter-spacing="0">这些分支同样算处理完成</text><g id="send"><rect x="792" y="476" width="280" height="156" rx="15" fill="#FFFFFF" stroke="#DCE4EF" stroke-width="1.3"/><path d="M807 476H1057Q1072 476 1072 491V515H792V491Q792 476 807 476Z" fill="#EDF3FF"/></g><text x="812" y="501" font-size="13" font-weight="700" fill="#3168DC" text-anchor="start" letter-spacing="0.6">SEND / GROUP LOCK</text><text x="812" y="541" font-size="21" font-weight="700" fill="#1B2D49" text-anchor="start" letter-spacing="0">正文分页，再逐图发送</text><text x="812" y="569" font-size="17" font-weight="400" fill="#607188" text-anchor="start" letter-spacing="0">需要时补翻译，共享单并发</text><text x="812" y="594" font-size="17" font-weight="400" fill="#607188" text-anchor="start" letter-spacing="0">正文、图片共用机器人限速</text><text x="812" y="619" font-size="17" font-weight="400" fill="#607188" text-anchor="start" letter-spacing="0">整篇持有群锁，保持发送顺序</text><rect x="48" y="748" width="280" height="132" rx="14" fill="#FFF5E9"/><text x="70" y="779" font-size="18" font-weight="700" fill="#BD6A18" text-anchor="start" letter-spacing="0">单张图片失败的降级</text><text x="70" y="809" font-size="17" font-weight="400" fill="#1B2D49" text-anchor="start" letter-spacing="0">4 次失败后发提示</text><text x="70" y="834" font-size="17" font-weight="400" fill="#1B2D49" text-anchor="start" letter-spacing="0">正文已成功仍算本篇送达</text><text x="70" y="859" font-size="17" font-weight="400" fill="#1B2D49" text-anchor="start" letter-spacing="0">不会因此重复推送正文</text><g id="delivery-retry"><rect x="420" y="748" width="280" height="132" rx="15" fill="#FFFFFF" stroke="#DCE4EF" stroke-width="1.3"/><path d="M435 748H685Q700 748 700 763V787H420V763Q420 748 435 748Z" fill="#FAEEEE"/></g><text x="440" y="773" font-size="13" font-weight="700" fill="#BE5151" text-anchor="start" letter-spacing="0.6">ERROR / NEXT CHECK</text><text x="440" y="813" font-size="21" font-weight="700" fill="#1B2D49" text-anchor="start" letter-spacing="0">等待下次推送检查</text><text x="440" y="841" font-size="17" font-weight="400" fill="#607188" text-anchor="start" letter-spacing="0">正文或 Detail 写入未确认完成</text><text x="440" y="866" font-size="17" font-weight="400" fill="#607188" text-anchor="start" letter-spacing="0">本轮不缓存为全部完成</text><g id="delivered"><rect x="792" y="748" width="280" height="132" rx="15" fill="#FFFFFF" stroke="#DCE4EF" stroke-width="1.3"/><path d="M807 748H1057Q1072 748 1072 763V787H792V763Q792 748 807 748Z" fill="#EAF7F3"/></g><text x="812" y="773" font-size="13" font-weight="700" fill="#16877B" text-anchor="start" letter-spacing="0.6">STORE / DETAIL</text><text x="812" y="813" font-size="21" font-weight="700" fill="#1B2D49" text-anchor="start" letter-spacing="0">写入成功投递记录</text><text x="812" y="841" font-size="17" font-weight="400" fill="#607188" text-anchor="start" letter-spacing="0">article_id + 群 OpenID</text><text x="812" y="866" font-size="17" font-weight="400" fill="#607188" text-anchor="start" letter-spacing="0">updated 保存发送时间</text><rect x="322" y="398" width="104" height="30" rx="7" fill="#FFFFFF"/><text x="374" y="414" font-size="14" font-weight="600" fill="#BD6A18" text-anchor="middle" letter-spacing="0">静默 / 窗口外</text><rect x="903.247" y="411" width="57.506" height="30" rx="7" fill="#FFFFFF"/><text x="932" y="427" font-size="14" font-weight="600" fill="#3168DC" text-anchor="middle" letter-spacing="0">SEND</text><rect x="894" y="683" width="76" height="30" rx="7" fill="#FFFFFF"/><text x="932" y="699" font-size="14" font-weight="600" fill="#16877B" text-anchor="middle" letter-spacing="0">正文完成</text><rect x="591" y="669" width="118" height="30" rx="7" fill="#FFFFFF"/><text x="650" y="685" font-size="14" font-weight="600" fill="#BE5151" text-anchor="middle" letter-spacing="0">正文 / 记账异常</text><rect x="48" y="942" width="1024" height="112" rx="14" fill="#EDF3FF"/><text x="70" y="973" font-size="18" font-weight="700" fill="#3168DC" text-anchor="start" letter-spacing="0">处理结果与跨轮复用</text><text x="70" y="1003" font-size="17" font-weight="400" fill="#1B2D49" text-anchor="start" letter-spacing="0">各群均处理完成后，缓存账号 digest + 群订阅 + 群配置指纹；相同窗口不重复处理。</text><text x="70" y="1028" font-size="17" font-weight="400" fill="#1B2D49" text-anchor="start" letter-spacing="0">QQ 发送和 Detail 记账不是原子事务：发送后崩溃或记账失败，重试可能再次发送正文。</text><text x="48" y="1096" font-size="13" font-weight="400" fill="#607188" text-anchor="start" letter-spacing="0">自动推送休息时段固定北京时间。手动 refresh 不受该休息时段限制，但仍遵守启动静默与逐群去重规则。</text></g></svg>
