<svg xmlns="http://www.w3.org/2000/svg" width="296.333333mm" height="267.229167mm" viewBox="0 0 1120 1010" role="img" aria-labelledby="title description"><title id="title">全账户采集，两条消费路径</title><desc id="description">订阅决定 QQ 投递范围；已采集的全部条目进入缓存与补偿流程。</desc><defs><marker id="arrow-blue" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#3168DC"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#16877B"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#BD6A18"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#BE5151"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#765CC1"/></marker></defs><g font-family="Songti SC, SimSun, Noto Serif CJK SC, serif"><rect width="1120" height="1010" fill="#FFFFFF"/><path d="M328 258 L420 258" fill="none" stroke="#3168DC" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/><path d="M700 258 L792 258" fill="none" stroke="#3168DC" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/><path d="M932 192 L932 166 L560 166 L560 192" fill="none" stroke="#765CC1" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-purple)"/><path d="M560 324 L560 398" fill="none" stroke="#3168DC" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/><path d="M420 464 L328 464" fill="none" stroke="#3168DC" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/><path d="M700 258 L748 258 L748 366 L932 366 L932 398" fill="none" stroke="#765CC1" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-purple)"/><path d="M560 530 L560 604" fill="none" stroke="#16877B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/><path d="M700 670 L792 670" fill="none" stroke="#16877B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/><path d="M48 464 L24 464 L24 780 L356 780 L356 902 L420 902" fill="none" stroke="#16877B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/><path d="M328 670 L384 670 L384 850 L420 850" fill="none" stroke="#16877B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/><path d="M560 736 L560 810" fill="none" stroke="#16877B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/><path d="M560 942 L560 966 L188 966 L188 942" fill="none" stroke="#3168DC" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/><path d="M932 736 L932 810" fill="none" stroke="#3168DC" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/><text x="48" y="33" font-size="13" font-weight="400" fill="#607188" text-anchor="start" letter-spacing="1.6">NSYBOT  /  CURRENT IMPLEMENTATION</text><text x="48" y="83" font-size="36" font-weight="700" fill="#1B2D49" text-anchor="start" letter-spacing="0">全账户采集，两条消费路径</text><text x="48" y="119" font-size="17" font-weight="400" fill="#607188" text-anchor="start" letter-spacing="0">订阅决定 QQ 投递范围；已采集的全部条目进入缓存与补偿流程。</text><path d="M48 145H1072" stroke="#DCE4EF" stroke-width="1"/><text x="1072" y="77" font-size="17" font-weight="400" fill="#3168DC" text-anchor="end" letter-spacing="0">01 / 06</text><g id="accounts"><rect x="48" y="192" width="280" height="132" rx="15" fill="#FFFFFF" stroke="#DCE4EF" stroke-width="1.3"/><path d="M63 192H313Q328 192 328 207V231H48V207Q48 192 63 192Z" fill="#EAF7F3"/></g><text x="68" y="217" font-size="13" font-weight="700" fill="#16877B" text-anchor="start" letter-spacing="0.6">INPUT / USER + PLANTFORM</text><text x="68" y="257" font-size="21" font-weight="700" fill="#1B2D49" text-anchor="start" letter-spacing="0">账户与平台列表</text><text x="68" y="285" font-size="17" font-weight="400" fill="#607188" text-anchor="start" letter-spacing="0">无群订阅也参与采集</text><text x="68" y="310" font-size="17" font-weight="400" fill="#607188" text-anchor="start" letter-spacing="0">账号之间保留 5–15 秒间隔</text><g id="collector"><rect x="420" y="192" width="280" height="132" rx="15" fill="#FFFFFF" stroke="#DCE4EF" stroke-width="1.3"/><path d="M435 192H685Q700 192 700 207V231H420V207Q420 192 435 192Z" fill="#EDF3FF"/></g><text x="440" y="217" font-size="13" font-weight="700" fill="#3168DC" text-anchor="start" letter-spacing="0.6">COLLECT / 20 MIN</text><text x="440" y="257" font-size="21" font-weight="700" fill="#1B2D49" text-anchor="start" letter-spacing="0">统一 RSS 采集</text><text x="440" y="285" font-size="17" font-weight="400" fill="#607188" text-anchor="start" letter-spacing="0">启动即执行，之后每 20 分钟</text><text x="440" y="310" font-size="17" font-weight="400" fill="#607188" text-anchor="start" letter-spacing="0">主源失败后尝试备用 RSSHub</text><g id="rsshub"><rect x="792" y="192" width="280" height="132" rx="15" fill="#FFFFFF" stroke="#DCE4EF" stroke-width="1.3"/><path d="M807 192H1057Q1072 192 1072 207V231H792V207Q792 192 807 192Z" fill="#F2EEFA"/></g><text x="812" y="217" font-size="13" font-weight="700" fill="#765CC1" text-anchor="start" letter-spacing="0.6">EXTERNAL / RSSHUB</text><text x="812" y="257" font-size="21" font-weight="700" fill="#1B2D49" text-anchor="start" letter-spacing="0">主源与备用源</text><text x="812" y="285" font-size="17" font-weight="400" fill="#607188" text-anchor="start" letter-spacing="0">同一账号每轮复用一份响应</text><text x="812" y="310" font-size="17" font-weight="400" fill="#607188" text-anchor="start" letter-spacing="0">返回有限的近期 RSS 窗口</text><g id="window"><rect x="48" y="398" width="280" height="132" rx="15" fill="#FFFFFF" stroke="#DCE4EF" stroke-width="1.3"/><path d="M63 398H313Q328 398 328 413V437H48V413Q48 398 63 398Z" fill="#EAF7F3"/></g><text x="68" y="423" font-size="13" font-weight="700" fill="#16877B" text-anchor="start" letter-spacing="0.6">STORE / RSS_FEED_CACHE</text><text x="68" y="463" font-size="21" font-weight="700" fill="#1B2D49" text-anchor="start" letter-spacing="0">最近一次有效窗口</text><text x="68" y="491" font-size="17" font-weight="400" fill="#607188" text-anchor="start" letter-spacing="0">按账号保存 entries 与 digest</text><text x="68" y="516" font-size="17" font-weight="400" fill="#607188" text-anchor="start" letter-spacing="0">抓取失败不覆盖旧快照</text><g id="queue"><rect x="420" y="398" width="280" height="132" rx="15" fill="#FFFFFF" stroke="#DCE4EF" stroke-width="1.3"/><path d="M435 398H685Q700 398 700 413V437H420V413Q420 398 435 398Z" fill="#FFF5E9"/></g><text x="440" y="423" font-size="13" font-weight="700" fill="#BD6A18" text-anchor="start" letter-spacing="0.6">STORE / RSS_INGEST_QUEUE</text><text x="440" y="463" font-size="21" font-weight="700" fill="#1B2D49" text-anchor="start" letter-spacing="0">先落原始条目队列</text><text x="440" y="491" font-size="17" font-weight="400" fill="#607188" text-anchor="start" letter-spacing="0">只为缺失或损坏缓存排队</text><text x="440" y="516" font-size="17" font-weight="400" fill="#607188" text-anchor="start" letter-spacing="0">后台补偿不再抓取 RSS</text><g id="source"><rect x="792" y="398" width="280" height="132" rx="15" fill="#FFFFFF" stroke="#DCE4EF" stroke-width="1.3"/><path d="M807 398H1057Q1072 398 1072 413V437H792V413Q792 398 807 398Z" fill="#F2EEFA"/></g><text x="812" y="423" font-size="13" font-weight="700" fill="#765CC1" text-anchor="start" letter-spacing="0.6">HEALTH / TWITTER</text><text x="812" y="463" font-size="21" font-weight="700" fill="#1B2D49" text-anchor="start" letter-spacing="0">链路状态与待通知队列</text><text x="812" y="491" font-size="17" font-weight="400" fill="#607188" text-anchor="start" letter-spacing="0">退避跨重启保留</text><text x="812" y="516" font-size="17" font-weight="400" fill="#607188" text-anchor="start" letter-spacing="0">独立上报 Uptime Kuma</text><g id="subscriptions"><rect x="48" y="604" width="280" height="132" rx="15" fill="#FFFFFF" stroke="#DCE4EF" stroke-width="1.3"/><path d="M63 604H313Q328 604 328 619V643H48V619Q48 604 63 604Z" fill="#EAF7F3"/></g><text x="68" y="629" font-size="13" font-weight="700" fill="#16877B" text-anchor="start" letter-spacing="0.6">POLICY / SUBSCRIBE + CONFIG</text><text x="68" y="669" font-size="21" font-weight="700" fill="#1B2D49" text-anchor="start" letter-spacing="0">群订阅与群设置</text><text x="68" y="697" font-size="17" font-weight="400" fill="#607188" text-anchor="start" letter-spacing="0">决定发送给谁、发最近几篇</text><text x="68" y="722" font-size="17" font-weight="400" fill="#607188" text-anchor="start" letter-spacing="0">不决定是否采集或存库</text><g id="content"><rect x="420" y="604" width="280" height="132" rx="15" fill="#FFFFFF" stroke="#DCE4EF" stroke-width="1.3"/><path d="M435 604H685Q700 604 700 619V643H420V619Q420 604 435 604Z" fill="#EAF7F3"/></g><text x="440" y="629" font-size="13" font-weight="700" fill="#16877B" text-anchor="start" letter-spacing="0.6">STORE / CONTENT + IMAGE SYNC</text><text x="440" y="669" font-size="21" font-weight="700" fill="#1B2D49" text-anchor="start" letter-spacing="0">历史正文与图片索引</text><text x="440" y="697" font-size="17" font-weight="400" fill="#607188" text-anchor="start" letter-spacing="0">正文与图片 URL 持久化</text><text x="440" y="722" font-size="17" font-weight="400" fill="#607188" text-anchor="start" letter-spacing="0">索引按首次图片文章入库递增</text><g id="api"><rect x="792" y="604" width="280" height="132" rx="15" fill="#FFFFFF" stroke="#DCE4EF" stroke-width="1.3"/><path d="M807 604H1057Q1072 604 1072 619V643H792V619Q792 604 807 604Z" fill="#EDF3FF"/></g><text x="812" y="629" font-size="13" font-weight="700" fill="#3168DC" text-anchor="start" letter-spacing="0.6">READ ONLY / FASTAPI</text><text x="812" y="669" font-size="21" font-weight="700" fill="#1B2D49" text-anchor="start" letter-spacing="0">内部图片增量 API</text><text x="812" y="697" font-size="17" font-weight="400" fill="#607188" text-anchor="start" letter-spacing="0">Bearer Token + seq 游标</text><text x="812" y="722" font-size="17" font-weight="400" fill="#607188" text-anchor="start" letter-spacing="0">只读元数据，不抓取、不发 QQ</text><g id="detail"><rect x="48" y="810" width="280" height="132" rx="15" fill="#FFFFFF" stroke="#DCE4EF" stroke-width="1.3"/><path d="M63 810H313Q328 810 328 825V849H48V825Q48 810 63 810Z" fill="#EAF7F3"/></g><text x="68" y="835" font-size="13" font-weight="700" fill="#16877B" text-anchor="start" letter-spacing="0.6">STORE / DETAIL</text><text x="68" y="875" font-size="21" font-weight="700" fill="#1B2D49" text-anchor="start" letter-spacing="0">逐群处理记录</text><text x="68" y="903" font-size="17" font-weight="400" fill="#607188" text-anchor="start" letter-spacing="0">已投递、启动静默与跳过</text><text x="68" y="928" font-size="17" font-weight="400" fill="#607188" text-anchor="start" letter-spacing="0">跨重启查询去重</text><g id="qq"><rect x="420" y="810" width="280" height="132" rx="15" fill="#FFFFFF" stroke="#DCE4EF" stroke-width="1.3"/><path d="M435 810H685Q700 810 700 825V849H420V825Q420 810 435 810Z" fill="#EDF3FF"/></g><text x="440" y="835" font-size="13" font-weight="700" fill="#3168DC" text-anchor="start" letter-spacing="0.6">DELIVER / 60 SEC</text><text x="440" y="875" font-size="21" font-weight="700" fill="#1B2D49" text-anchor="start" letter-spacing="0">QQ 官方 Bot 投递</text><text x="440" y="903" font-size="17" font-weight="400" fill="#607188" text-anchor="start" letter-spacing="0">优先读 Content，按群筛选</text><text x="440" y="928" font-size="17" font-weight="400" fill="#607188" text-anchor="start" letter-spacing="0">正文分页与原图共用群锁</text><g id="aiaibot"><rect x="792" y="810" width="280" height="132" rx="15" fill="#FFFFFF" stroke="#DCE4EF" stroke-width="1.3"/><path d="M807 810H1057Q1072 810 1072 825V849H792V825Q792 810 807 810Z" fill="#F2EEFA"/></g><text x="812" y="835" font-size="13" font-weight="700" fill="#765CC1" text-anchor="start" letter-spacing="0.6">CONSUMER / AIAIBOT</text><text x="812" y="875" font-size="21" font-weight="700" fill="#1B2D49" text-anchor="start" letter-spacing="0">aiaibot 独立同步</text><text x="812" y="903" font-size="17" font-weight="400" fill="#607188" text-anchor="start" letter-spacing="0">经 Docker 内网调用 API</text><text x="812" y="928" font-size="17" font-weight="400" fill="#607188" text-anchor="start" letter-spacing="0">图片下载与游标保存由其完成</text><rect x="706" y="145" width="76" height="30" rx="7" fill="#FFFFFF"/><text x="744" y="161" font-size="14" font-weight="600" fill="#765CC1" text-anchor="middle" letter-spacing="0">有效响应</text><rect x="508" y="348" width="104" height="30" rx="7" fill="#FFFFFF"/><text x="560" y="364" font-size="14" font-weight="600" fill="#3168DC" text-anchor="middle" letter-spacing="0">全部有效条目</text><rect x="336" y="440" width="76" height="30" rx="7" fill="#FFFFFF"/><text x="374" y="456" font-size="14" font-weight="600" fill="#3168DC" text-anchor="middle" letter-spacing="0">保存窗口</text><rect x="522" y="556" width="76" height="30" rx="7" fill="#FFFFFF"/><text x="560" y="572" font-size="14" font-weight="600" fill="#16877B" text-anchor="middle" letter-spacing="0">原子入库</text><rect x="722" y="647" width="48" height="30" rx="7" fill="#FFFFFF"/><text x="746" y="663" font-size="14" font-weight="600" fill="#16877B" text-anchor="middle" letter-spacing="0">只读</text><rect x="522" y="761" width="76" height="30" rx="7" fill="#FFFFFF"/><text x="560" y="777" font-size="14" font-weight="600" fill="#16877B" text-anchor="middle" letter-spacing="0">读取正文</text><rect x="329" y="941" width="90" height="30" rx="7" fill="#FFFFFF"/><text x="374" y="957" font-size="14" font-weight="600" fill="#3168DC" text-anchor="middle" letter-spacing="0">写处理结果</text><rect x="887" y="761" width="90" height="30" rx="7" fill="#FFFFFF"/><text x="932" y="777" font-size="14" font-weight="600" fill="#3168DC" text-anchor="middle" letter-spacing="0">分页元数据</text><text x="48" y="986" font-size="13" font-weight="400" fill="#607188" text-anchor="start" letter-spacing="0">蓝：执行流程   绿：持久化数据   橙：等待与补偿   紫：外部系统 / 监控。所有图描述当前代码。</text></g></svg>
