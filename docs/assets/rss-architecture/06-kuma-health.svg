<svg xmlns="http://www.w3.org/2000/svg" width="296.333333mm" height="272.520833mm" viewBox="0 0 1120 1030" role="img" aria-labelledby="title description"><title id="title">Twitter 链路状态与 Kuma 通知</title><desc id="description">健康观测、通知入队、网络上报与确认各自分工；通知渠道由 Kuma 管理。</desc><defs><marker id="arrow-blue" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#3168DC"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#16877B"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#BD6A18"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#BE5151"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#765CC1"/></marker></defs><g font-family="Songti SC, SimSun, Noto Serif CJK SC, serif"><rect width="1120" height="1030" fill="#FFFFFF"/><path d="M328 302 L420 302" fill="none" stroke="#3168DC" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/><path d="M700 302 L792 302" fill="none" stroke="#16877B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/><path d="M932 380 L932 478" fill="none" stroke="#BD6A18" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-amber)"/><path d="M792 544 L700 544" fill="none" stroke="#3168DC" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/><path d="M420 544 L328 544" fill="none" stroke="#16877B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/><path d="M188 610 L188 724" fill="none" stroke="#16877B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#arrow-teal)"/><path d="M560 610 L560 724" fill="none" stroke="#765CC1" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-purple)"/><path d="M700 544 L748 544 L748 790 L792 790" fill="none" stroke="#BD6A18" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-amber)"/><path d="M1072 790 L1096 790 L1096 302 L1072 302" fill="none" stroke="#BD6A18" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#arrow-amber)"/><text x="48" y="33" font-size="13" font-weight="400" fill="#607188" text-anchor="start" letter-spacing="1.6">NSYBOT  /  CURRENT IMPLEMENTATION</text><text x="48" y="83" font-size="36" font-weight="700" fill="#1B2D49" text-anchor="start" letter-spacing="0">Twitter 链路状态与 Kuma 通知</text><text x="48" y="119" font-size="17" font-weight="400" fill="#607188" text-anchor="start" letter-spacing="0">健康观测、通知入队、网络上报与确认各自分工；通知渠道由 Kuma 管理。</text><path d="M48 145H1072" stroke="#DCE4EF" stroke-width="1"/><text x="1072" y="77" font-size="17" font-weight="400" fill="#3168DC" text-anchor="end" letter-spacing="0">06 / 06</text><g id="observe"><rect x="48" y="224" width="280" height="156" rx="15" fill="#FFFFFF" stroke="#DCE4EF" stroke-width="1.3"/><path d="M63 224H313Q328 224 328 239V263H48V239Q48 224 63 224Z" fill="#EDF3FF"/></g><text x="68" y="249" font-size="13" font-weight="700" fill="#3168DC" text-anchor="start" letter-spacing="0.6">OBSERVE / SOURCE ROUND</text><text x="68" y="289" font-size="21" font-weight="700" fill="#1B2D49" text-anchor="start" letter-spacing="0">接收本轮健康观测</text><text x="68" y="317" font-size="17" font-weight="400" fill="#607188" text-anchor="start" letter-spacing="0">有效响应：up 心跳</text><text x="68" y="342" font-size="17" font-weight="400" fill="#607188" text-anchor="start" letter-spacing="0">全源限流 / 故障：down</text><text x="68" y="367" font-size="17" font-weight="400" fill="#607188" text-anchor="start" letter-spacing="0">状态变化与周期心跳分开判断</text><g id="source-status"><rect x="420" y="224" width="280" height="156" rx="15" fill="#FFFFFF" stroke="#DCE4EF" stroke-width="1.3"/><path d="M435 224H685Q700 224 700 239V263H420V239Q420 224 435 224Z" fill="#EAF7F3"/></g><text x="440" y="249" font-size="13" font-weight="700" fill="#16877B" text-anchor="start" letter-spacing="0.6">PERSIST / SOURCE STATUS</text><text x="440" y="289" font-size="21" font-weight="700" fill="#1B2D49" text-anchor="start" letter-spacing="0">更新持久化链路状态</text><text x="440" y="317" font-size="17" font-weight="400" fill="#607188" text-anchor="start" letter-spacing="0">available 与 observed_at</text><text x="440" y="342" font-size="17" font-weight="400" fill="#607188" text-anchor="start" letter-spacing="0">retry_at 跨进程重启保留</text><text x="440" y="367" font-size="17" font-weight="400" fill="#607188" text-anchor="start" letter-spacing="0">与通知入队在同一事务</text><g id="notice-outbox"><rect x="792" y="224" width="280" height="156" rx="15" fill="#FFFFFF" stroke="#DCE4EF" stroke-width="1.3"/><path d="M807 224H1057Q1072 224 1072 239V263H792V239Q792 224 807 224Z" fill="#FFF5E9"/></g><text x="812" y="249" font-size="13" font-weight="700" fill="#BD6A18" text-anchor="start" letter-spacing="0.6">OUTBOX / SOURCE NOTICE</text><text x="812" y="289" font-size="21" font-weight="700" fill="#1B2D49" text-anchor="start" letter-spacing="0">持久化待上报状态</text><text x="812" y="317" font-size="17" font-weight="400" fill="#607188" text-anchor="start" letter-spacing="0">仅配置 UT_URL 时入队</text><text x="812" y="342" font-size="17" font-weight="400" fill="#607188" text-anchor="start" letter-spacing="0">连续同状态合并检测时间</text><text x="812" y="367" font-size="17" font-weight="400" fill="#607188" text-anchor="start" letter-spacing="0">不同状态按顺序保留</text><g id="ack"><rect x="48" y="478" width="280" height="132" rx="15" fill="#FFFFFF" stroke="#DCE4EF" stroke-width="1.3"/><path d="M63 478H313Q328 478 328 493V517H48V493Q48 478 63 478Z" fill="#EAF7F3"/></g><text x="68" y="503" font-size="13" font-weight="700" fill="#16877B" text-anchor="start" letter-spacing="0.6">ACK / ID + OBSERVED_AT</text><text x="68" y="543" font-size="21" font-weight="700" fill="#1B2D49" text-anchor="start" letter-spacing="0">只确认已发送的那个版本</text><text x="68" y="571" font-size="17" font-weight="400" fill="#607188" text-anchor="start" letter-spacing="0">匹配 id + observed_at 才删除</text><text x="68" y="596" font-size="17" font-weight="400" fill="#607188" text-anchor="start" letter-spacing="0">新观测不会被旧确认清除</text><g id="kuma-api"><rect x="420" y="478" width="280" height="132" rx="15" fill="#FFFFFF" stroke="#DCE4EF" stroke-width="1.3"/><path d="M435 478H685Q700 478 700 493V517H420V493Q420 478 435 478Z" fill="#F2EEFA"/></g><text x="440" y="503" font-size="13" font-weight="700" fill="#765CC1" text-anchor="start" letter-spacing="0.6">HTTP / UPTIME KUMA</text><text x="440" y="543" font-size="21" font-weight="700" fill="#1B2D49" text-anchor="start" letter-spacing="0">提交 Push 状态与消息</text><text x="440" y="571" font-size="17" font-weight="400" fill="#607188" text-anchor="start" letter-spacing="0">必须 HTTP 成功且 ok=true</text><text x="440" y="596" font-size="17" font-weight="400" fill="#607188" text-anchor="start" letter-spacing="0">发送采集检测时间与 up/down</text><g id="notice-worker"><rect x="792" y="478" width="280" height="132" rx="15" fill="#FFFFFF" stroke="#DCE4EF" stroke-width="1.3"/><path d="M807 478H1057Q1072 478 1072 493V517H792V493Q792 478 807 478Z" fill="#EDF3FF"/></g><text x="812" y="503" font-size="13" font-weight="700" fill="#3168DC" text-anchor="start" letter-spacing="0.6">SCHEDULE / 60 SEC</text><text x="812" y="543" font-size="21" font-weight="700" fill="#1B2D49" text-anchor="start" letter-spacing="0">独立读取通知队列</text><text x="812" y="571" font-size="17" font-weight="400" fill="#607188" text-anchor="start" letter-spacing="0">按 id 顺序处理，单次最多 10 条</text><text x="812" y="596" font-size="17" font-weight="400" fill="#607188" text-anchor="start" letter-spacing="0">不等待 QQ 在线或推文入库</text><rect x="48" y="724" width="280" height="132" rx="14" fill="#EAF7F3"/><text x="70" y="755" font-size="18" font-weight="700" fill="#16877B" text-anchor="start" letter-spacing="0">发送时出现新观测</text><text x="70" y="785" font-size="17" font-weight="400" fill="#1B2D49" text-anchor="start" letter-spacing="0">旧版本确认匹配不到新时间</text><text x="70" y="810" font-size="17" font-weight="400" fill="#1B2D49" text-anchor="start" letter-spacing="0">新版仍在队列，之后继续上报</text><text x="70" y="835" font-size="17" font-weight="400" fill="#1B2D49" text-anchor="start" letter-spacing="0">可能再次发送相同可用性</text><g id="kuma-channels"><rect x="420" y="724" width="280" height="132" rx="15" fill="#FFFFFF" stroke="#DCE4EF" stroke-width="1.3"/><path d="M435 724H685Q700 724 700 739V763H420V739Q420 724 435 724Z" fill="#F2EEFA"/></g><text x="440" y="749" font-size="13" font-weight="700" fill="#765CC1" text-anchor="start" letter-spacing="0.6">NOTIFY / KUMA CHANNELS</text><text x="440" y="789" font-size="21" font-weight="700" fill="#1B2D49" text-anchor="start" letter-spacing="0">由 Kuma 发送上下线通知</text><text x="440" y="817" font-size="17" font-weight="400" fill="#607188" text-anchor="start" letter-spacing="0">Twitter 上线 / Twitter 下线</text><text x="440" y="842" font-size="17" font-weight="400" fill="#607188" text-anchor="start" letter-spacing="0">通知渠道及重发策略在其配置</text><g id="notice-retry"><rect x="792" y="724" width="280" height="132" rx="15" fill="#FFFFFF" stroke="#DCE4EF" stroke-width="1.3"/><path d="M807 724H1057Q1072 724 1072 739V763H792V739Q792 724 807 724Z" fill="#FFF5E9"/></g><text x="812" y="749" font-size="13" font-weight="700" fill="#BD6A18" text-anchor="start" letter-spacing="0.6">RETRY / KEEP OUTBOX</text><text x="812" y="789" font-size="21" font-weight="700" fill="#1B2D49" text-anchor="start" letter-spacing="0">未获确认，保留重试</text><text x="812" y="817" font-size="17" font-weight="400" fill="#607188" text-anchor="start" letter-spacing="0">网络 / HTTP / ok 校验失败</text><text x="812" y="842" font-size="17" font-weight="400" fill="#607188" text-anchor="start" letter-spacing="0">下次 60 秒调度继续尝试</text><rect x="336" y="515" width="76" height="30" rx="7" fill="#FFFFFF"/><text x="374" y="531" font-size="14" font-weight="600" fill="#16877B" text-anchor="middle" letter-spacing="0">确认成功</text><rect x="150" y="661" width="76" height="30" rx="7" fill="#FFFFFF"/><text x="188" y="677" font-size="14" font-weight="600" fill="#16877B" text-anchor="middle" letter-spacing="0">版本保护</text><rect x="522" y="661" width="76" height="30" rx="7" fill="#FFFFFF"/><text x="560" y="677" font-size="14" font-weight="600" fill="#765CC1" text-anchor="middle" letter-spacing="0">通知策略</text><rect x="717" y="657" width="62" height="30" rx="7" fill="#FFFFFF"/><text x="748" y="673" font-size="14" font-weight="600" fill="#BD6A18" text-anchor="middle" letter-spacing="0">未确认</text><rect x="48" y="906" width="1024" height="78" rx="14" fill="#EDF3FF"/><text x="70" y="937" font-size="18" font-weight="700" fill="#3168DC" text-anchor="start" letter-spacing="0">心跳不是仅在状态变化时发送</text><text x="70" y="967" font-size="17" font-weight="400" fill="#1B2D49" text-anchor="start" letter-spacing="0">正常启动和后续有效探测也会入队 up 心跳；Kuma 超时阈值应覆盖 20 分钟采集间隔与整轮耗时。</text><text x="48" y="1006" font-size="13" font-weight="400" fill="#607188" text-anchor="start" letter-spacing="0">这里表示 nsybot 经 RSSHub 的 Twitter 采集链路，不代表 Twitter 全站可用性；上报允许重试，不能宣称严格一次通知。</text></g></svg>
