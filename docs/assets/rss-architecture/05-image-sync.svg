<svg xmlns="http://www.w3.org/2000/svg" width="296.333333mm" height="301.625000mm" viewBox="0 0 1120 1140" role="img" aria-labelledby="title description"><title id="title">内部图片同步：游标分页与消费者检查点</title><desc id="description">API 返回图片元数据；图片文件由 aiaibot 依据原始 URL 自行下载。</desc><defs><marker id="arrow-blue" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#3168DC"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#16877B"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#BD6A18"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#BE5151"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#765CC1"/></marker></defs><g font-family="Songti SC, SimSun, Noto Serif CJK SC, serif"><rect width="1120" height="1140" fill="#FFFFFF"/><path d="M152 324V942" stroke="#DCE4EF" stroke-width="1.4" stroke-dasharray="5 6"/><path d="M424 324V942" stroke="#DCE4EF" stroke-width="1.4" stroke-dasharray="5 6"/><path d="M696 324V942" stroke="#DCE4EF" stroke-width="1.4" stroke-dasharray="5 6"/><path d="M968 324V942" stroke="#DCE4EF" stroke-width="1.4" stroke-dasharray="5 6"/><rect x="146" y="360" width="12" height="554" rx="4" fill="#F2EEFA" stroke="#765CC1"/><rect x="418" y="360" width="12" height="330" rx="4" fill="#EDF3FF" stroke="#3168DC"/><rect x="690" y="462" width="12" height="126" rx="4" fill="#EAF7F3" stroke="#16877B"/><rect x="962" y="788" width="12" height="128" rx="4" fill="#F2EEFA" stroke="#765CC1"/><path d="M158 376H418" fill="none" stroke="#3168DC" stroke-width="2.2" marker-end="url(#arrow-blue)"/><path d="M430 478H690" fill="none" stroke="#16877B" stroke-width="2.2" marker-end="url(#arrow-teal)"/><path d="M690 574H430" fill="none" stroke="#16877B" stroke-width="2.2" stroke-dasharray="6 5" marker-end="url(#arrow-teal)"/><path d="M418 674H158" fill="none" stroke="#3168DC" stroke-width="2.2" stroke-dasharray="6 5" marker-end="url(#arrow-blue)"/><path d="M158 804H962" fill="none" stroke="#765CC1" stroke-width="2.2" marker-end="url(#arrow-purple)"/><path d="M962 900H158" fill="none" stroke="#765CC1" stroke-width="2.2" stroke-dasharray="6 5" marker-end="url(#arrow-purple)"/><text x="48" y="33" font-size="13" font-weight="400" fill="#607188" text-anchor="start" letter-spacing="1.6">NSYBOT  /  CURRENT IMPLEMENTATION</text><text x="48" y="83" font-size="36" font-weight="700" fill="#1B2D49" text-anchor="start" letter-spacing="0">内部图片同步：游标分页与消费者检查点</text><text x="48" y="119" font-size="17" font-weight="400" fill="#607188" text-anchor="start" letter-spacing="0">API 返回图片元数据；图片文件由 aiaibot 依据原始 URL 自行下载。</text><path d="M48 145H1072" stroke="#DCE4EF" stroke-width="1"/><text x="1072" y="77" font-size="17" font-weight="400" fill="#3168DC" text-anchor="end" letter-spacing="0">05 / 06</text><g id="actor-0"><rect x="48" y="192" width="208" height="132" rx="15" fill="#FFFFFF" stroke="#DCE4EF" stroke-width="1.3"/><path d="M63 192H241Q256 192 256 207V231H48V207Q48 192 63 192Z" fill="#F2EEFA"/></g><text x="68" y="217" font-size="13" font-weight="700" fill="#765CC1" text-anchor="start" letter-spacing="0.6">PARTICIPANT</text><text x="68" y="257" font-size="21" font-weight="700" fill="#1B2D49" text-anchor="start" letter-spacing="0">aiaibot</text><text x="68" y="285" font-size="17" font-weight="400" fill="#607188" text-anchor="start" letter-spacing="0">独立消费进程</text><g id="actor-1"><rect x="320" y="192" width="208" height="132" rx="15" fill="#FFFFFF" stroke="#DCE4EF" stroke-width="1.3"/><path d="M335 192H513Q528 192 528 207V231H320V207Q320 192 335 192Z" fill="#EDF3FF"/></g><text x="340" y="217" font-size="13" font-weight="700" fill="#3168DC" text-anchor="start" letter-spacing="0.6">PARTICIPANT</text><text x="340" y="257" font-size="21" font-weight="700" fill="#1B2D49" text-anchor="start" letter-spacing="0">nsybot HTTP</text><text x="340" y="285" font-size="17" font-weight="400" fill="#607188" text-anchor="start" letter-spacing="0">现有 FastAPI 服务</text><g id="actor-2"><rect x="592" y="192" width="208" height="132" rx="15" fill="#FFFFFF" stroke="#DCE4EF" stroke-width="1.3"/><path d="M607 192H785Q800 192 800 207V231H592V207Q592 192 607 192Z" fill="#EAF7F3"/></g><text x="612" y="217" font-size="13" font-weight="700" fill="#16877B" text-anchor="start" letter-spacing="0.6">PARTICIPANT</text><text x="612" y="257" font-size="21" font-weight="700" fill="#1B2D49" text-anchor="start" letter-spacing="0">SQLite</text><text x="612" y="285" font-size="17" font-weight="400" fill="#607188" text-anchor="start" letter-spacing="0">Content + ImageSync</text><g id="actor-3"><rect x="864" y="192" width="208" height="132" rx="15" fill="#FFFFFF" stroke="#DCE4EF" stroke-width="1.3"/><path d="M879 192H1057Q1072 192 1072 207V231H864V207Q864 192 879 192Z" fill="#F2EEFA"/></g><text x="884" y="217" font-size="13" font-weight="700" fill="#765CC1" text-anchor="start" letter-spacing="0.6">PARTICIPANT</text><text x="884" y="257" font-size="21" font-weight="700" fill="#1B2D49" text-anchor="start" letter-spacing="0">图片 CDN</text><text x="884" y="285" font-size="17" font-weight="400" fill="#607188" text-anchor="start" letter-spacing="0">原始图片 URL</text><rect x="202.512" y="346" width="170.976" height="50" rx="7" fill="#FFFFFF"/><text x="288" y="362" font-size="14" font-weight="600" fill="#3168DC" text-anchor="middle" letter-spacing="0">GET /internal/v1/images</text><text x="288" y="382" font-size="14" font-weight="600" fill="#3168DC" text-anchor="middle" letter-spacing="0">cursor=N · limit≤200</text><rect x="481.69399999999996" y="448" width="156.61200000000002" height="50" rx="7" fill="#FFFFFF"/><text x="560" y="464" font-size="14" font-weight="600" fill="#16877B" text-anchor="middle" letter-spacing="0">Bearer 鉴权通过后</text><text x="560" y="484" font-size="14" font-weight="600" fill="#16877B" text-anchor="middle" letter-spacing="0">读取 seq &gt; N 的下一页</text><rect x="460.498" y="544" width="199.004" height="50" rx="7" fill="#FFFFFF"/><text x="560" y="560" font-size="14" font-weight="600" fill="#16877B" text-anchor="middle" letter-spacing="0">ORDER BY seq · LIMIT L+1</text><text x="560" y="580" font-size="14" font-weight="600" fill="#16877B" text-anchor="middle" letter-spacing="0">释放数据库会话</text><rect x="174.56099999999998" y="644" width="226.87800000000001" height="50" rx="7" fill="#FFFFFF"/><text x="288" y="660" font-size="14" font-weight="600" fill="#3168DC" text-anchor="middle" letter-spacing="0">items · next_cursor · has_more</text><text x="288" y="680" font-size="14" font-weight="600" fill="#3168DC" text-anchor="middle" letter-spacing="0">仅元数据，Cache-Control: no-store</text><rect x="430.041" y="774" width="259.918" height="30" rx="7" fill="#FFFFFF"/><text x="560" y="790" font-size="14" font-weight="600" fill="#765CC1" text-anchor="middle" letter-spacing="0">按 items.images 中的原始 URL 下载图片</text><rect x="416.86699999999996" y="870" width="286.266" height="30" rx="7" fill="#FFFFFF"/><text x="560" y="886" font-size="14" font-weight="600" fill="#765CC1" text-anchor="middle" letter-spacing="0">图片文件；此流量不经过 nsybot 的同步 API</text><rect x="48" y="978" width="1024" height="112" rx="14" fill="#F2EEFA"/><text x="70" y="1009" font-size="18" font-weight="700" fill="#765CC1" text-anchor="start" letter-spacing="0">aiaibot 侧的消费契约</text><text x="70" y="1039" font-size="17" font-weight="400" fill="#1B2D49" text-anchor="start" letter-spacing="0">图片与元数据幂等处理成功后，再持久化 next_cursor；失败保留旧游标，允许整页重放。</text><text x="70" y="1064" font-size="17" font-weight="400" fill="#1B2D49" text-anchor="start" letter-spacing="0">历史补拉从 cursor=0 开始。seq 按入库先后排序，晚补入的旧推文也会获得更大的新 seq。</text><text x="48" y="1116" font-size="13" font-weight="400" fill="#607188" text-anchor="start" letter-spacing="0">消费者处理流程是接口使用约定，本仓库不包含 aiaibot 的实现。API 默认关闭；启用后通过共享 Docker 内网访问。</text></g></svg>
