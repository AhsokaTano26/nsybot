<svg xmlns="http://www.w3.org/2000/svg" width="296.333333mm" height="280.458333mm" viewBox="0 0 1120 1060" role="img" aria-labelledby="title description"><title id="title">持久化入库补偿与原子提交</title><desc id="description">原始条目先落盘；队列版本、正文和图片索引在事务边界内协同。</desc><defs><marker id="arrow-blue" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#3168DC"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#16877B"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#BD6A18"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#BE5151"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#765CC1"/></marker></defs><g font-family="Songti SC, SimSun, Noto Serif CJK SC, serif"><rect width="1120" height="1060" fill="#FFFFFF"/><path d="M626 184H1054Q1072 184 1072 202V918Q1072 936 1054 936H626Q608 936 608 918V202Q608 184 626 184Z" fill="#F5F7FB" stroke="#DCE4EF" stroke-dasharray="5 5"/><path d="M292 356 L292 444" fill="none" stroke="#3168DC" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/><path d="M292 600 L292 645 L176 645 L176 688" fill="none" stroke="#BD6A18" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-amber)"/><path d="M292 600 L292 645 L408 645 L408 688" fill="none" stroke="#765CC1" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-purple)"/><path d="M512 522 L556 522 L556 952 L512 952" fill="none" stroke="#16877B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/><path d="M72 766 L34 766 L34 290 L72 290" fill="none" stroke="#BD6A18" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#arrow-amber)"/><path d="M840 384 L840 440" fill="none" stroke="#3168DC" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/><path d="M840 572 L840 628" fill="none" stroke="#16877B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/><path d="M840 760 L840 816" fill="none" stroke="#16877B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/><text x="48" y="33" font-size="13" font-weight="400" fill="#607188" text-anchor="start" letter-spacing="1.6">NSYBOT  /  CURRENT IMPLEMENTATION</text><text x="48" y="83" font-size="36" font-weight="700" fill="#1B2D49" text-anchor="start" letter-spacing="0">持久化入库补偿与原子提交</text><text x="48" y="119" font-size="17" font-weight="400" fill="#607188" text-anchor="start" letter-spacing="0">原始条目先落盘；队列版本、正文和图片索引在事务边界内协同。</text><path d="M48 145H1072" stroke="#DCE4EF" stroke-width="1"/><text x="1072" y="77" font-size="17" font-weight="400" fill="#3168DC" text-anchor="end" letter-spacing="0">03 / 06</text><text x="628" y="214" font-size="16" font-weight="700" fill="#607188" text-anchor="start" letter-spacing="0">写入细节 / 同一数据库事务</text><g id="queued"><rect x="72" y="224" width="440" height="132" rx="15" fill="#FFFFFF" stroke="#DCE4EF" stroke-width="1.3"/><path d="M87 224H497Q512 224 512 239V263H72V239Q72 224 87 224Z" fill="#FFF5E9"/></g><text x="92" y="249" font-size="13" font-weight="700" fill="#BD6A18" text-anchor="start" letter-spacing="0.6">DURABLE / QUEUED</text><text x="92" y="289" font-size="21" font-weight="700" fill="#1B2D49" text-anchor="start" letter-spacing="0">已排队，等待到期处理</text><text x="92" y="317" font-size="17" font-weight="400" fill="#607188" text-anchor="start" letter-spacing="0">相同内容不重置失败次数或退避时间</text><text x="92" y="342" font-size="17" font-weight="400" fill="#607188" text-anchor="start" letter-spacing="0">原始内容改变时生成新 version</text><g id="processing"><rect x="72" y="444" width="440" height="156" rx="15" fill="#FFFFFF" stroke="#DCE4EF" stroke-width="1.3"/><path d="M87 444H497Q512 444 512 459V483H72V459Q72 444 87 444Z" fill="#EDF3FF"/></g><text x="92" y="469" font-size="13" font-weight="700" fill="#3168DC" text-anchor="start" letter-spacing="0.6">WORKER / DUE + FORMAT</text><text x="92" y="509" font-size="21" font-weight="700" fill="#1B2D49" text-anchor="start" letter-spacing="0">预算内加载并处理原始条目</text><text x="92" y="537" font-size="17" font-weight="400" fill="#607188" text-anchor="start" letter-spacing="0">独立每 60 秒补偿；默认最多 100 条</text><text x="92" y="562" font-size="17" font-weight="400" fill="#607188" text-anchor="start" letter-spacing="0">4 MiB 批次预算，条目间检查 1 秒预算</text><text x="92" y="587" font-size="17" font-weight="400" fill="#607188" text-anchor="start" letter-spacing="0">单次 HTML 提取，缓存阶段不翻译</text><g id="retry-pending"><rect x="72" y="688" width="208" height="156" rx="15" fill="#FFFFFF" stroke="#DCE4EF" stroke-width="1.3"/><path d="M87 688H265Q280 688 280 703V727H72V703Q72 688 87 688Z" fill="#FFF5E9"/></g><text x="92" y="713" font-size="13" font-weight="700" fill="#BD6A18" text-anchor="start" letter-spacing="0.6">RETRY_PENDING</text><text x="92" y="753" font-size="21" font-weight="700" fill="#1B2D49" text-anchor="start" letter-spacing="0">保留并退避</text><text x="92" y="781" font-size="17" font-weight="400" fill="#607188" text-anchor="start" letter-spacing="0">30 / 60 / 120 秒…</text><text x="92" y="806" font-size="17" font-weight="400" fill="#607188" text-anchor="start" letter-spacing="0">最长 1 小时</text><text x="92" y="831" font-size="17" font-weight="400" fill="#607188" text-anchor="start" letter-spacing="0">超限原始条目保留</text><g id="superseded"><rect x="304" y="688" width="208" height="156" rx="15" fill="#FFFFFF" stroke="#DCE4EF" stroke-width="1.3"/><path d="M319 688H497Q512 688 512 703V727H304V703Q304 688 319 688Z" fill="#F2EEFA"/></g><text x="324" y="713" font-size="13" font-weight="700" fill="#765CC1" text-anchor="start" letter-spacing="0.6">SUPERSEDED</text><text x="324" y="753" font-size="21" font-weight="700" fill="#1B2D49" text-anchor="start" letter-spacing="0">旧版本已失效</text><text x="324" y="781" font-size="17" font-weight="400" fill="#607188" text-anchor="start" letter-spacing="0">不覆盖新版本</text><text x="324" y="806" font-size="17" font-weight="400" fill="#607188" text-anchor="start" letter-spacing="0">不清除新任务</text><text x="324" y="831" font-size="17" font-weight="400" fill="#607188" text-anchor="start" letter-spacing="0">旧任务结束</text><rect x="72" y="904" width="440" height="96" rx="14" fill="#EAF7F3"/><text x="94" y="935" font-size="18" font-weight="700" fill="#16877B" text-anchor="start" letter-spacing="0">COMMITTED / 入库完成</text><text x="94" y="965" font-size="17" font-weight="400" fill="#1B2D49" text-anchor="start" letter-spacing="0">正文、索引与本版本确认一起生效</text><g id="claim"><rect x="648" y="252" width="384" height="132" rx="15" fill="#FFFFFF" stroke="#DCE4EF" stroke-width="1.3"/><path d="M663 252H1017Q1032 252 1032 267V291H648V267Q648 252 663 252Z" fill="#EDF3FF"/></g><text x="668" y="277" font-size="13" font-weight="700" fill="#3168DC" text-anchor="start" letter-spacing="0.6">01 / CLAIM + WRITE LOCK</text><text x="668" y="317" font-size="21" font-weight="700" fill="#1B2D49" text-anchor="start" letter-spacing="0">按 id + version 删除队列行</text><text x="668" y="345" font-size="17" font-weight="400" fill="#607188" text-anchor="start" letter-spacing="0">先校验版本并取得 SQLite 写锁</text><text x="668" y="370" font-size="17" font-weight="400" fill="#607188" text-anchor="start" letter-spacing="0">匹配不到则返回 SUPERSEDED</text><g id="write-content"><rect x="648" y="440" width="384" height="132" rx="15" fill="#FFFFFF" stroke="#DCE4EF" stroke-width="1.3"/><path d="M663 440H1017Q1032 440 1032 455V479H648V455Q648 440 663 440Z" fill="#EAF7F3"/></g><text x="668" y="465" font-size="13" font-weight="700" fill="#16877B" text-anchor="start" letter-spacing="0.6">02 / CONTENT</text><text x="668" y="505" font-size="21" font-weight="700" fill="#1B2D49" text-anchor="start" letter-spacing="0">插入或更新正文与图片 URL</text><text x="668" y="533" font-size="17" font-weight="400" fill="#607188" text-anchor="start" letter-spacing="0">保留已有有效译文</text><text x="668" y="558" font-size="17" font-weight="400" fill="#607188" text-anchor="start" letter-spacing="0">flush 成功后继续</text><g id="write-index"><rect x="648" y="628" width="384" height="132" rx="15" fill="#FFFFFF" stroke="#DCE4EF" stroke-width="1.3"/><path d="M663 628H1017Q1032 628 1032 643V667H648V643Q648 628 663 628Z" fill="#EAF7F3"/></g><text x="668" y="653" font-size="13" font-weight="700" fill="#16877B" text-anchor="start" letter-spacing="0.6">03 / RSS_IMAGE_SYNC</text><text x="668" y="693" font-size="21" font-weight="700" fill="#1B2D49" text-anchor="start" letter-spacing="0">按需登记图片同步序号</text><text x="668" y="721" font-size="17" font-weight="400" fill="#607188" text-anchor="start" letter-spacing="0">有图片且尚无索引时新增 seq</text><text x="668" y="746" font-size="17" font-weight="400" fill="#607188" text-anchor="start" letter-spacing="0">翻译更新不会生成新序号</text><rect x="648" y="816" width="384" height="96" rx="14" fill="#EAF7F3"/><text x="670" y="847" font-size="18" font-weight="700" fill="#16877B" text-anchor="start" letter-spacing="0">04 / COMMIT</text><text x="670" y="877" font-size="17" font-weight="400" fill="#1B2D49" text-anchor="start" letter-spacing="0">全部成功才提交；任一步失败整体回滚</text><rect x="231.83100000000002" y="384" width="120.338" height="30" rx="7" fill="#FFFFFF"/><text x="292" y="400" font-size="14" font-weight="600" fill="#3168DC" text-anchor="middle" letter-spacing="0">到期 + 预算允许</text><rect x="118" y="622" width="118" height="30" rx="7" fill="#FFFFFF"/><text x="177" y="638" font-size="14" font-weight="600" fill="#BD6A18" text-anchor="middle" letter-spacing="0">解析 / 写库失败</text><rect x="365" y="622" width="90" height="30" rx="7" fill="#FFFFFF"/><text x="410" y="638" font-size="14" font-weight="600" fill="#765CC1" text-anchor="middle" letter-spacing="0">版本不匹配</text><rect x="518" y="855" width="76" height="30" rx="7" fill="#FFFFFF"/><text x="556" y="871" font-size="14" font-weight="600" fill="#16877B" text-anchor="middle" letter-spacing="0">提交成功</text><text x="48" y="1036" font-size="13" font-weight="400" fill="#607188" text-anchor="start" letter-spacing="0">排队本身失败：本轮明确失败、旧快照不更新。队列成功后即使文章暂未入库，也能在 RSS 窗口之外继续补偿。</text></g></svg>
