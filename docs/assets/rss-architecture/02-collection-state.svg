<svg xmlns="http://www.w3.org/2000/svg" width="296.333333mm" height="275.166667mm" viewBox="0 0 1120 1040" role="img" aria-labelledby="title description"><title id="title">采集轮次状态与 RSS 源切换</title><desc id="description">SourceRound 是单轮内存状态；暂停截止时间另存 RSSSourceStatus。</desc><defs><marker id="arrow-blue" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#3168DC"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#16877B"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#BD6A18"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#BE5151"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#765CC1"/></marker></defs><g font-family="Songti SC, SimSun, Noto Serif CJK SC, serif"><rect width="1120" height="1040" fill="#FFFFFF"/><path d="M328 290 L420 290" fill="none" stroke="#16877B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/><path d="M188 356 L188 480" fill="none" stroke="#BD6A18" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-amber)"/><path d="M328 546 L376 546 L376 290 L420 290" fill="none" stroke="#16877B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/><path d="M328 546 L792 546" fill="none" stroke="#BE5151" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-red)"/><path d="M560 356 L560 402 L932 402 L932 480" fill="none" stroke="#BE5151" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-red)"/><path d="M188 224 L188 183 L1096 183 L1096 546 L1072 546" fill="none" stroke="#BE5151" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-red)"/><path d="M932 612 L932 686" fill="none" stroke="#BE5151" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-red)"/><text x="48" y="33" font-size="13" font-weight="400" fill="#607188" text-anchor="start" letter-spacing="1.6">NSYBOT  /  CURRENT IMPLEMENTATION</text><text x="48" y="83" font-size="36" font-weight="700" fill="#1B2D49" text-anchor="start" letter-spacing="0">采集轮次状态与 RSS 源切换</text><text x="48" y="119" font-size="17" font-weight="400" fill="#607188" text-anchor="start" letter-spacing="0">SourceRound 是单轮内存状态；暂停截止时间另存 RSSSourceStatus。</text><path d="M48 145H1072" stroke="#DCE4EF" stroke-width="1"/><text x="1072" y="77" font-size="17" font-weight="400" fill="#3168DC" text-anchor="end" letter-spacing="0">02 / 06</text><g id="unobserved"><rect x="48" y="224" width="280" height="132" rx="15" fill="#FFFFFF" stroke="#DCE4EF" stroke-width="1.3"/><path d="M63 224H313Q328 224 328 239V263H48V239Q48 224 63 224Z" fill="#EDF3FF"/></g><text x="68" y="249" font-size="13" font-weight="700" fill="#3168DC" text-anchor="start" letter-spacing="0.6">UNOBSERVED</text><text x="68" y="289" font-size="21" font-weight="700" fill="#1B2D49" text-anchor="start" letter-spacing="0">本轮尚无有效观测</text><text x="68" y="317" font-size="17" font-weight="400" fill="#607188" text-anchor="start" letter-spacing="0">每轮重新创建</text><text x="68" y="342" font-size="17" font-weight="400" fill="#607188" text-anchor="start" letter-spacing="0">账号级错误保持状态、清计数</text><g id="available"><rect x="420" y="224" width="280" height="132" rx="15" fill="#FFFFFF" stroke="#DCE4EF" stroke-width="1.3"/><path d="M435 224H685Q700 224 700 239V263H420V239Q420 224 435 224Z" fill="#EAF7F3"/></g><text x="440" y="249" font-size="13" font-weight="700" fill="#16877B" text-anchor="start" letter-spacing="0.6">AVAILABLE</text><text x="440" y="289" font-size="21" font-weight="700" fill="#1B2D49" text-anchor="start" letter-spacing="0">本轮已有有效响应</text><text x="440" y="317" font-size="17" font-weight="400" fill="#607188" text-anchor="start" letter-spacing="0">有效空窗口也算成功</text><text x="440" y="342" font-size="17" font-weight="400" fill="#607188" text-anchor="start" letter-spacing="0">成功时清连续故障计数</text><g id="failing"><rect x="48" y="480" width="280" height="132" rx="15" fill="#FFFFFF" stroke="#DCE4EF" stroke-width="1.3"/><path d="M63 480H313Q328 480 328 495V519H48V495Q48 480 63 480Z" fill="#FFF5E9"/></g><text x="68" y="505" font-size="13" font-weight="700" fill="#BD6A18" text-anchor="start" letter-spacing="0.6">FAILING</text><text x="68" y="545" font-size="21" font-weight="700" fill="#1B2D49" text-anchor="start" letter-spacing="0">暂未成功，累计全源故障</text><text x="68" y="573" font-size="17" font-weight="400" fill="#607188" text-anchor="start" letter-spacing="0">低于阈值时继续下一个账号</text><text x="68" y="598" font-size="17" font-weight="400" fill="#607188" text-anchor="start" letter-spacing="0">本轮结束仍失败则记下线</text><g id="paused"><rect x="792" y="480" width="280" height="132" rx="15" fill="#FFFFFF" stroke="#DCE4EF" stroke-width="1.3"/><path d="M807 480H1057Q1072 480 1072 495V519H792V495Q792 480 807 480Z" fill="#FAEEEE"/></g><text x="812" y="505" font-size="13" font-weight="700" fill="#BE5151" text-anchor="start" letter-spacing="0.6">PAUSED</text><text x="812" y="545" font-size="21" font-weight="700" fill="#1B2D49" text-anchor="start" letter-spacing="0">暂停本轮剩余 Twitter</text><text x="812" y="573" font-size="17" font-weight="400" fill="#607188" text-anchor="start" letter-spacing="0">429 / 全源限流立即触发</text><text x="812" y="598" font-size="17" font-weight="400" fill="#607188" text-anchor="start" letter-spacing="0">或连续全源故障达到阈值</text><rect x="792" y="224" width="280" height="132" rx="14" fill="#EAF7F3"/><text x="814" y="255" font-size="18" font-weight="700" fill="#16877B" text-anchor="start" letter-spacing="0">已成功后的少量故障</text><text x="814" y="285" font-size="17" font-weight="400" fill="#1B2D49" text-anchor="start" letter-spacing="0">状态仍为 AVAILABLE</text><text x="814" y="310" font-size="17" font-weight="400" fill="#1B2D49" text-anchor="start" letter-spacing="0">连续计数累加，到阈值暂停</text><rect x="336" y="263" width="76" height="30" rx="7" fill="#FFFFFF"/><text x="374" y="279" font-size="14" font-weight="600" fill="#16877B" text-anchor="middle" letter-spacing="0">有效响应</text><rect x="150" y="386" width="76" height="50" rx="7" fill="#FFFFFF"/><text x="188" y="402" font-size="14" font-weight="600" fill="#BD6A18" text-anchor="middle" letter-spacing="0">全源故障</text><text x="188" y="422" font-size="14" font-weight="600" fill="#BD6A18" text-anchor="middle" letter-spacing="0">未达阈值</text><rect x="352" y="398" width="48" height="30" rx="7" fill="#FFFFFF"/><text x="376" y="414" font-size="14" font-weight="600" fill="#16877B" text-anchor="middle" letter-spacing="0">恢复</text><rect x="473" y="519" width="174" height="30" rx="7" fill="#FFFFFF"/><text x="560" y="535" font-size="14" font-weight="600" fill="#BE5151" text-anchor="middle" letter-spacing="0">连续故障达到阈值 / 限流</text><rect x="687" y="375" width="118" height="30" rx="7" fill="#FFFFFF"/><text x="746" y="391" font-size="14" font-weight="600" fill="#BE5151" text-anchor="middle" letter-spacing="0">达到阈值 / 限流</text><rect x="608" y="162" width="188" height="30" rx="7" fill="#FFFFFF"/><text x="702" y="178" font-size="14" font-weight="600" fill="#BE5151" text-anchor="middle" letter-spacing="0">首次即全源限流：立即暂停</text><rect x="48" y="686" width="640" height="146" rx="14" fill="#EDF3FF"/><text x="70" y="717" font-size="18" font-weight="700" fill="#3168DC" text-anchor="start" letter-spacing="0">每个 RSSHub 实例：首次请求 + 3 次指数退避</text><text x="70" y="747" font-size="17" font-weight="400" fill="#1B2D49" text-anchor="start" letter-spacing="0">请求 → 等 2 秒 → 重试 → 等 4 秒 → 重试 → 等 8 秒 → 重试</text><text x="70" y="772" font-size="17" font-weight="400" fill="#1B2D49" text-anchor="start" letter-spacing="0">仍失败则切备用；更长 Retry-After 可直接冷却并切源</text><text x="70" y="797" font-size="17" font-weight="400" fill="#1B2D49" text-anchor="start" letter-spacing="0">资源超限直接切源；格式或网络错误保留正常重试</text><g id="next-round"><rect x="792" y="686" width="280" height="156" rx="15" fill="#FFFFFF" stroke="#DCE4EF" stroke-width="1.3"/><path d="M807 686H1057Q1072 686 1072 701V725H792V701Q792 686 807 686Z" fill="#F2EEFA"/></g><text x="812" y="711" font-size="13" font-weight="700" fill="#765CC1" text-anchor="start" letter-spacing="0.6">PERSIST / NEXT ROUND</text><text x="812" y="751" font-size="21" font-weight="700" fill="#1B2D49" text-anchor="start" letter-spacing="0">保存全局暂停截止时间</text><text x="812" y="779" font-size="17" font-weight="400" fill="#607188" text-anchor="start" letter-spacing="0">默认至少退避 900 秒</text><text x="812" y="804" font-size="17" font-weight="400" fill="#607188" text-anchor="start" letter-spacing="0">到期后的下一次采集再探测</text><text x="812" y="829" font-size="17" font-weight="400" fill="#607188" text-anchor="start" letter-spacing="0">其他平台仍继续采集</text><rect x="874.953" y="636" width="114.094" height="30" rx="7" fill="#FFFFFF"/><text x="932" y="652" font-size="14" font-weight="600" fill="#BE5151" text-anchor="middle" letter-spacing="0">记录 down 观测</text><rect x="48" y="874" width="1024" height="102" rx="14" fill="#FFF5E9"/><text x="70" y="905" font-size="18" font-weight="700" fill="#BD6A18" text-anchor="start" letter-spacing="0">两个层次的冷却，各自负责不同范围</text><text x="70" y="935" font-size="17" font-weight="400" fill="#1B2D49" text-anchor="start" letter-spacing="0">实例路由冷却在内存中；Twitter 全局 retry_at 持久化。暂停不创建账号级抓取重试队列。</text><text x="48" y="1016" font-size="13" font-weight="400" fill="#607188" text-anchor="start" letter-spacing="0">默认连续故障阈值 = 3。单账号 400 / 404 / 410、资源超限优先按账号错误处理，不据此判定全局下线。</text></g></svg>
